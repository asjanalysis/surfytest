<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#070514">
    <meta
      name="description"
      content="A privacy-friendly, audio-reactive aurora rendered in real time with Three.js."
    >
    <title>Aurora Sound Wave</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <canvas id="scene" aria-hidden="true"></canvas>
      <section class="hud">
        <h1 id="title">Aurora Sound Wave</h1>
        <p>
          Connect a microphone or capture tab/system audio to drive the aurora palette with any sound source.
        </p>
        <div class="controls" role="group" aria-label="Audio input options">
          <button id="microphoneBtn" type="button" aria-pressed="false">Enable Microphone</button>
          <button id="deviceAudioBtn" type="button" aria-pressed="false">Capture Device Audio</button>
        </div>
        <p id="status" role="status" aria-live="polite">Waiting to start…</p>
        <noscript><p>This visualization requires JavaScript.</p></noscript>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
